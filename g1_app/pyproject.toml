[project]
name = "g1-app"
version = "0.2.0"
description = "Unitree G1 balanced stand, interactive control, and fall-recovery training (MuJoCo + ONNX)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  # mujoco must match mujoco-warp exactly: newer mujoco drops flags warp imports.
  "mujoco==3.5.0",
  "onnxruntime>=1.20",
  "numpy>=1.26",
  "imageio>=2.30",
  "imageio-ffmpeg>=0.5",
  "tensorboard>=2.15",  # dashboard event parsing
]

[project.optional-dependencies]
train = [
  "mjlab==1.2.0",
  "mujoco-warp==3.5.0",
  # mjlab 1.2.0 uses warp's wp.context API, removed in newer warp-lang.
  "warp-lang==1.14.0",
  # NOTE: the mjlab==1.2.0 wheel on PyPI calls wp.context.runtime in
  # mjlab/sim/sim.py (absent in warp-lang 1.14/1.17). The working build
  # uses wp.get_cuda_driver_version() there instead — the Colab notebook
  # applies this one-line sed after install. Whole tree otherwise identical.
]
dev = [
  "pytest>=8",
  "ruff>=0.4",
]

[project.scripts]
g1 = "g1_app.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["g1_app*", "core*", "apps*", "lab*", "tools*", "training*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Research-sim code: allow broad excepts + empty handlers (surfaced in UI/logs),
# long legacy functions, and implicit string concat in dashboard METRICS.
ignore = ["BLE001", "S110", "S112", "S101", "ISC004", "RUF046", "RUF059", "FURB167", "FURB192", "E501"]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# Runtime sys.path bootstrapping (imports after path setup).
"cli.py" = ["E402"]
"lab/train.py" = ["E402"]
"lab/dashboard.py" = ["E402"]
"lab/record.py" = ["E402"]
"apps/*.py" = ["E402"]
"core/*.py" = ["E402"]
"tools/*.py" = ["E402"]
"scripts/*.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests", "g1_app/tests"]
